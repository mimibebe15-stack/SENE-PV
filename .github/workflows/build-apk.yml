name: Compilar APK SENE PV

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar convertidor del ícono
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Preparar aplicación Android
        run: |
          npm run prepare:web
          rm -rf android
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/java/com/sene/puntodeventas2026
          rsvg-convert --width 512 --height 512 assets/sene-pv-launcher-v2.svg -o android/app/src/main/res/mipmap-xxxhdpi/sene_pv_launcher.png
          cp native/file_paths.xml android/app/src/main/res/xml/sene_file_paths.xml
          cp native/MainActivity.java android/app/src/main/java/com/sene/puntodeventas2026/MainActivity.java
          cp native/InventoryFilePlugin.java android/app/src/main/java/com/sene/puntodeventas2026/InventoryFilePlugin.java
          perl -0pi -e 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/sene_pv_launcher" android:roundIcon="@mipmap/sene_pv_launcher"|' android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's|</application>|<provider android:name="androidx.core.content.FileProvider" android:authorities="com.sene.puntodeventas2026.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="\@xml/sene_file_paths" /></provider></application>|' android/app/src/main/AndroidManifest.xml
          grep -q "registerPlugin(InventoryFilePlugin.class)" android/app/src/main/java/com/sene/puntodeventas2026/MainActivity.java

      - name: Compilar APK instalable
        working-directory: android
        run: |
          ./gradlew assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SENE-PV-APK-Instalable
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
