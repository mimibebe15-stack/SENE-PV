name: Compilar APK Corregido

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Crear Android APK
    runs-on: ubuntu-24.04

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Instalar dependencias del proyecto
      run: npm install

    - name: Crear carpeta assets obligatoria de Capacitor
      run: mkdir -p android/app/src/main/assets && echo "{}" > android/app/src/main/assets/capacitor.plugins.json

    - name: Sincronizar configuraciones de Capacitor
      run: |
        npx cap update
        npx cap copy

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Conceder permisos de ejecucion a Gradle
      run: chmod +x android/gradlew

    - name: Compilar archivo APK limpio
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Subir APK final como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: App-Corregida-WhatsApp
        path: android/app/build/outputs/apk/debug/app-debug.apk
